    <script>
      (function() {
        // Safe console.error filtering for Ace basePath inference notice
        try {
          if (typeof console !== 'undefined' && console.error) {
            var origConsoleError = console.error;
            console.error = function() {
              var str = '';
              for (var i = 0; i < arguments.length; i++) {
                str += ' ' + String(arguments[i]);
              }
              if (str.indexOf('Unable to infer path to ace') !== -1) {
                return;
              }
              return origConsoleError.apply(console, arguments);
            };
          }
        } catch (_) {}

        // Safe Object.defineProperty interceptor to prevent extension collision crashes (e.g. MetaMask / web3 wallets redefining window.ethereum)
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                (prop === 'ethereum' || String(err && err.message).indexOf('Cannot redefine property') !== -1)
              ) {
                try {
                  if (obj && descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
              throw err;
            }
          };
        } catch (_) {}

        // Global window.onerror suppressor for extension injection & cross-origin noise
        try {
          var prevOnError = window.onerror;
          window.onerror = function(msg, url, line, col, error) {
            var str = String(msg || '');
            if (
              str.indexOf('ethereum') !== -1 ||
              str.indexOf('getLine') !== -1 ||
              str === 'Script error.' ||
              str.indexOf('Script error') !== -1 ||
              str.indexOf('Unable to infer path to ace') !== -1
            ) {
              return true; // suppresses the error report
            }
            if (typeof prevOnError === 'function') {
              return prevOnError.apply(this, arguments);
            }
          };
        } catch (_) {}

        // Global safe error swallow for browser extension / cross-origin script noise
        try {
          window.addEventListener('error', function(e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            var str = String(msg);
            if (
              str.indexOf('Cannot redefine property: ethereum') !== -1 ||
              str.indexOf('ethereum') !== -1 ||
              str.indexOf('getLine') !== -1 ||
              str === 'Script error.' ||
              str.indexOf('Script error') !== -1 ||
              str.indexOf('Unable to infer path to ace') !== -1
            ) {
              if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
              }
              if (typeof e.preventDefault === 'function') {
                e.preventDefault();
              }
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var msg = (e && (e.reason ? (e.reason.message || String(e.reason)) : '')) || '';
            var str = String(msg);
            if (
              str.indexOf('ethereum') !== -1 ||
              str.indexOf('getLine') !== -1 ||
              str === 'Script error.' ||
              str.indexOf('Script error') !== -1 ||
              str.indexOf('Unable to infer path to ace') !== -1
            ) {
              if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
              }
              if (typeof e.preventDefault === 'function') {
                e.preventDefault();
              }
            }
          }, true);
        } catch (_) {}

        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = originalFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || originalFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return activeFetch || originalFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
